/* ─── SCROLL ANIMATION HOOK ─── */
function useReveal() {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if(e.isIntersecting) { setVisible(true); obs.disconnect(); }}, { threshold: 0.12 });
    if(ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

/* ─── COUNTDOWN HOOK ─── */
function useCountdown(target) {
  const calc = () => {
    const diff = new Date(target) - new Date();
    if(diff <= 0) return { days:0, hours:0, mins:0, secs:0 };
    return {
      days: Math.floor(diff / 86400000),
      hours: Math.floor((diff % 86400000) / 3600000),
      mins: Math.floor((diff % 3600000) / 60000),
      secs: Math.floor((diff % 60000) / 1000),
    };
  };
  const [t, setT] = useState(calc);
  useEffect(() => { const id = setInterval(() => setT(calc()), 1000); return () => clearInterval(id); }, []);
  return t;
}

function Reveal({children, className="", dir="up", delay=0}) {
  const [ref, vis] = useReveal();
  const cls = dir==="left"?"reveal-left":dir==="right"?"reveal-right":"reveal";
  return <div ref={ref} className={`${cls}${vis?" visible":""} reveal-d${delay} ${className}`}>{children}</div>;
}

function ContactForm() {
  const [form, setForm] = useState({name:"",email:"",message:""});
  const [submitted, setSubmitted] = useState(false);
  const [sending, setSending] = useState(false);
  const handleInput = (e) => setForm(p=>({...p,[e.target.name]:e.target.value}));
  const handleSubmit = async () => {
    if(!form.name||!form.email||!form.message) return;
    setSending(true);
    await emailjs.send('service_xx6f2ub','template_3tzxesk',{
      name:form.name,email:form.email,phone:'N/A',
      type:'General Inquiry',
      details:form.message,
      payment:'N/A',
      total:'N/A'
    });
    setSending(false);
    setSubmitted(true);
  };
  if(submitted) return (
    <div className="cc-contact-submitted">
      Message received! We'll get back to you within 24–48 hours.
    </div>
  );
  return (
    <div>
      <div className="cc-contact-form-title">Send Us a Message</div>
      <div className="cc-form" style={{display:"flex",flexDirection:"column",gap:"14px"}}>
        <div className="cc-form-row">
          <div className="cc-form-group"><label className="cc-form-label">Name *</label><input className="cc-form-input" name="name" placeholder="Your name" value={form.name} onChange={handleInput}/></div>
          <div className="cc-form-group"><label className="cc-form-label">Email *</label><input className="cc-form-input" name="email" type="email" placeholder="you@email.com" value={form.email} onChange={handleInput}/></div>
        </div>
        <div className="cc-form-group"><label className="cc-form-label">Message *</label><textarea className="cc-form-input cc-form-textarea" name="message" placeholder="What's on your mind? Sponsorship, vendor questions, general inquiries..." value={form.message} onChange={handleInput} rows={5} style={{resize:"vertical"}}/></div>
        <button className="cc-btn-gold" style={{clipPath:"none",padding:"16px",opacity:(form.name&&form.email&&form.message)?1:0.5,cursor:(form.name&&form.email&&form.message)?"pointer":"not-allowed"}} onClick={handleSubmit} disabled={sending}>
          {sending ? "Sending..." : "Send Message"}
        </button>
      </div>
    </div>
  );
}

  {name:"Early Bird",price:"$15",perPerson:15,featured:false,includes:["Full access Aug 15 & 16","Priority entry — skip the line","Exclusive early bird lanyard","Shop vendors before the crowd"],note:"Limited availability — lock in the lowest price now."},

function TicketsPage({onNavigate}) {

      tier:selTier,quantity:qty,payment_method:selPayment,total_amount:amount

      await emailjs.send('service_xx6f2ub','template_3tzxesk',{
        name:form.name,email:form.email,phone:form.phone||'N/A',
        type:'Ticket Order',
        details:selTier+' x'+qty,
        payment:selPayment,
        total:amount

      setSubmitted(true);

        <div className="rp-form-inner">

function CollectrCon() {

  return (
    <div className="cc-root">
      <style>{globalCss}</style>
      <NavBar onNavigate={navigate} page={page}/>
      {page==="home"?<HomePage onNavigate={navigate}/>:page==="tickets"?<TicketsPage onNavigate={navigate}/>:<ReservePage onNavigate={navigate}/>}
    </div>
  );
}
